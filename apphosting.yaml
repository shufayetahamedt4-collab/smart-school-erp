# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting

env:
  # Firebase Admin credentials (set via App Hosting secrets in the console,
  # or reference an existing secret):
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY

  # Auth
  - variable: JWT_SECRET
    secret: JWT_SECRET

  # Storage bucket. Without this the Admin SDK falls back to
  # `<projectId>.appspot.com`, which does NOT exist for this project — the real
  # bucket is `<projectId>.firebasestorage.app`, so every upload and every
  # download URL (student photos, ID cards, attachments) would 404 in production.
  # Not a secret: the bucket name is already in the web app config.
  - variable: FIREBASE_STORAGE_BUCKET
    value: amar-e-school.firebasestorage.app

  # Public origin — used for QR links and storage download URLs.
  # ⚠️ Replace with the real App Hosting URL after the first deploy
  # (e.g. https://smart-school-erp-XXXX.web.app), then with your custom domain.
  - variable: APP_URL
    value: https://smart-school-erp-1--amar-e-school.asia-southeast1.hosted.app

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
